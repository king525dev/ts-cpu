<!doctype html>
<!-- src/web/demo.html -->
<!--
  A minimal consumer of the bundled API.

  Build the bundle first:  npm run build
  Then open this file directly in a browser (double-click works).

  The bundle is loaded from ../dist/web/oxntal.iife.js via a relative
  path, so it points at whatever you built locally.
-->
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Oxntal Web demo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
        }

        textarea {
            width: 100%;
            height: 12rem;
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
        }

        pre {
            background: #f4f4f4;
            padding: 0.5rem;
            overflow-x: auto;
        }

        canvas {
            border: 1px solid #ccc;
            display: block;
            margin-top: 0.5rem;
        }

        button {
            margin-right: 0.5rem;
        }

        .row {
            display: flex;
            gap: 2rem;
        }

        .row>div {
            flex: 1;
        }
    </style>
</head>

<body>
    <h1>Oxntal Web demo</h1>
    <p>This page is a <em>consumer</em> of the bundled library. It is not
        part of the library itself.</p>

    <textarea id="source">
// Print "Hi!" and then show a bar for value 42.
LDA " 33 105 72 "
DCD * 3
LDA 42
SHW
BRK
  </textarea>

    <div>
        <button id="run">Run</button>
        <button id="run-log">Run + log</button>
    </div>

    <div class="row">
        <div>
            <h2>stdout</h2>
            <pre id="stdout"></pre>
            <h2>error</h2>
            <pre id="stderr"></pre>
            <h2>final stack</h2>
            <pre id="stack"></pre>
        </div>
        <div>
            <h2>display</h2>
            <canvas id="screen" width="256" height="256"></canvas>
        </div>
    </div>

    <h2>log</h2>
    <pre id="log" style="max-height: 16rem; overflow: auto;"></pre>

    <!-- Load the bundle. In a real consumer this would be a CDN URL. -->
    <script src="../../dist/web/oxntal.iife.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const canvas = $("screen");

        function show(result) {
            $("stdout").textContent = result.stdout || "(nothing)";
            $("stderr").textContent = result.error
                ? `[${result.error.kind}] ${result.error.message}`
                : result.stderr || "(nothing)";
            $("stack").textContent = JSON.stringify(result.finalStack);
            $("log").textContent = result.log ?? "(log not captured)";
        }

        $("run").addEventListener("click", () => {
            const r = window.Oxntal.run({ source: $("source").value, canvas });
            show(r);
        });

        $("run-log").addEventListener("click", () => {
            const r = window.Oxntal.run({
                source: $("source").value,
                canvas,
                captureLog: true,
            });
            show(r);
        });
    </script>
</body>

</html>
